# Contrôle des secrets sur chaque PR et chaque push sur main. Sans IA.
name: Verification des secrets
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fichiers suivis et historique
        run: python3 scripts/verif_secrets.py . --historique
